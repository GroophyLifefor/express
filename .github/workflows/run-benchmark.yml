name: PR Load Test (run-benchmark)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  load:
    if: github.event.label.name == 'run-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout perf-wg
        uses: actions/checkout@v7
        with:
          repository: expressjs/perf-wg
          path: perf-wg

      - name: Checkout express (PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: express-head

      - name: Checkout express (PR base)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: express-base

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install perf-wg
        working-directory: perf-wg
        run: npm install

      - name: Pack express (head + base)
        run: |
          npm pack ./express-head --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/express-*.tgz "$RUNNER_TEMP"/express-head.tgz
          npm pack ./express-base --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/express-*.tgz "$RUNNER_TEMP"/express-base.tgz
          ls -l "$RUNNER_TEMP"/*.tgz

      - name: Load test (PR head)
        working-directory: perf-wg
        run: |
          NODE_VER="$(node -p 'process.versions.node')"
          npm run load -- \
            --test=@expressjs/perf-load-example \
            --overrides="{\"express\":\"file:$RUNNER_TEMP/express-head.tgz\"}" \
            --node="$NODE_VER" \
            --duration=10 \
            --output "$RUNNER_TEMP/head.json"

      - name: Load test (PR base)
        working-directory: perf-wg
        run: |
          NODE_VER="$(node -p 'process.versions.node')"
          npm run load -- \
            --test=@expressjs/perf-load-example \
            --overrides="{\"express\":\"file:$RUNNER_TEMP/express-base.tgz\"}" \
            --node="$NODE_VER" \
            --duration=10 \
            --output "$RUNNER_TEMP/base.json"

      - name: Compare results
        working-directory: perf-wg
        run: |
          npm run compare -- --cwd "$RUNNER_TEMP" head.json base.json > "$RUNNER_TEMP/compare.txt" 2>&1 || true
          cat "$RUNNER_TEMP/compare.txt"

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const file = path.join(process.env.RUNNER_TEMP, 'compare.txt')
            const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'compare output not found'
            const out = raw.replace(/\x1b\[[0-9;]*m/g, '')
            const body = [
              '## PR load test (base vs head)',
              '',
              '```',
              out.trim(),
              '```'
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })
